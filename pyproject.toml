[project]
name = "aos-example"
version = "0.1.0"
description = "AOS example repository: a small notes app with a disposable PostgreSQL and a browser verification command."
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "playwright==1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
