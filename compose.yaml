# Disposable PostgreSQL for one checkout. Data lives on tmpfs, so `down` leaves nothing behind.
# The host port is ephemeral; scripts/db.sh url reads it back.
services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 1s
      timeout: 2s
      retries: 30
